name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#7C5CFF&color_dots=#ebedf0,#c9e9fb,#8fd4f7,#54c5f8,#7c5cff
            dist/snake-dark.svg?palette=github-dark&color_snake=#54C5F8&color_dots=#161b22,#1e2a4a,#3b3f9e,#7c5cff,#54c5f8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
