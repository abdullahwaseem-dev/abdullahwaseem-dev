<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Have an app idea? Let's build it together. Start a project.">
<defs>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#54C5F8"/><stop offset=".3" stop-color="#ffffff" stop-opacity=".05"/><stop offset=".6" stop-color="#A78BFF"/><stop offset=".85" stop-color="#ffffff" stop-opacity=".05"/><stop offset="1" stop-color="#FF8AD0"/>
    <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="btn" x1="0" x2="1"><stop offset="0" stop-color="#54C5F8"/><stop offset=".55" stop-color="#A78BFF"/><stop offset="1" stop-color="#FF8AD0"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy="1" r=".8"><stop offset="0" stop-color="#7C5CFF" stop-opacity=".35"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/></radialGradient>
  <filter id="soft" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="14"/></filter>
  <clipPath id="c"><rect width="1200" height="230" rx="28"/></clipPath>
</defs>
<style>
  @keyframes breathe{0%,100%{opacity:.35}50%{opacity:.8}}
  .halo{animation:breathe 4s ease-in-out infinite}
</style>
<g clip-path="url(#c)">
  <rect width="1200" height="230" fill="#0B0D14"/>
  <rect width="1200" height="230" fill="url(#glow)"/>
</g>
<rect x="1" y="1" width="1198" height="228" rx="27" fill="none" stroke="url(#ring)" stroke-width="2"/>
<text x="600" y="84" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="300" letter-spacing="-.8" fill="#F4F6FB">Have an app idea? <tspan font-weight="700" fill="url(#btn)">Let's build it.</tspan></text>
<text x="600" y="118" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#9AA3B5">Freelance &amp; contract Flutter development · Remote worldwide</text>
<rect class="halo" x="490" y="140" width="220" height="52" rx="26" fill="url(#btn)" filter="url(#soft)"/>
<rect x="490" y="140" width="220" height="52" rx="26" fill="url(#btn)"/>
<text x="600" y="172" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#07080D">Start a project  →</text>
</svg>
