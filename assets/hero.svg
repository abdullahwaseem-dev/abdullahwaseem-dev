<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Muhammad Abdullah Waseem, Flutter Developer">
<defs>
  <linearGradient id="ink" x1="0" x2="1"><stop offset="0" stop-color="#54C5F8"/><stop offset=".55" stop-color="#A78BFF"/><stop offset="1" stop-color="#FF8AD0"/></linearGradient>
  <linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="-400" y1="0" x2="400" y2="0" spreadMethod="reflect">
    <stop offset="0" stop-color="#54C5F8"/><stop offset=".35" stop-color="#A78BFF"/><stop offset=".5" stop-color="#ffffff"/><stop offset=".65" stop-color="#A78BFF"/><stop offset="1" stop-color="#FF8AD0"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="800 0" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#54C5F8" stop-opacity=".55"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".05"/><stop offset="1" stop-color="#7C5CFF" stop-opacity=".55"/></linearGradient>
  <linearGradient id="rA" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#54C5F8"/><stop offset="1" stop-color="#7C5CFF" stop-opacity=".2"/></linearGradient>
  <linearGradient id="rB" x1="1" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FF8AD0"/><stop offset=".6" stop-color="#7C5CFF" stop-opacity=".6"/><stop offset="1" stop-color="#54C5F8" stop-opacity=".1"/></linearGradient>
  <radialGradient id="core" cx=".38" cy=".35" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset=".25" stop-color="#B9E9FF"/><stop offset=".6" stop-color="#7C5CFF"/><stop offset="1" stop-color="#2A1460"/></radialGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#7C5CFF" stop-opacity=".55"/><stop offset=".5" stop-color="#54C5F8" stop-opacity=".12"/><stop offset="1" stop-color="#54C5F8" stop-opacity="0"/></radialGradient>
  <linearGradient id="hair" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="80"/></filter>
  <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
  <clipPath id="frame"><rect width="1200" height="440" rx="28"/></clipPath>
</defs>
<style>
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(140px,50px) scale(1.15)}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-160px,-40px) scale(.9)}}
  @keyframes twinkle{0%,100%{opacity:.08}50%{opacity:.85}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}
  @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes word{0%{opacity:0;transform:translateY(8px)}3.75%,21.25%{opacity:1;transform:none}25.00%,100%{opacity:0;transform:translateY(-8px)}}
  @keyframes blink{50%{opacity:0}}
  @keyframes travel{0%{transform:translateX(0);opacity:0}10%,80%{opacity:1}100%{transform:translateX(420px);opacity:0}}
  .b1{animation:drift1 16s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .b2{animation:drift2 21s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .tw{animation:twinkle 4s ease-in-out infinite}
  .spin{transform-origin:960px 220px;animation:spin 40s linear infinite}
  .core{transform-origin:960px 220px;animation:breathe 6s ease-in-out infinite}
  .ring{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
    .word{opacity:0} .w0{animation:word 12s -1s infinite both} .w1{animation:word 12s 2s infinite both} .w2{animation:word 12s 5s infinite both} .w3{animation:word 12s 8s infinite both}
  .caret{animation:blink 1.1s steps(1) infinite}
  .spark{animation:travel 5s cubic-bezier(.4,0,.2,1) infinite}
</style>

